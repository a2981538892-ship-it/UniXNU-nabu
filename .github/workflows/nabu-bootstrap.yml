name: Nabu 17.7 bootstrap build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nabu-bootstrap-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Set build paths
        run: |
          echo "UNIXNU_IPSW=$RUNNER_TEMP/ipsw-21h16-small.zip" >> "$GITHUB_ENV"
          echo "UNIXNU_DEVICE=$RUNNER_TEMP/nabu-build/device" >> "$GITHUB_ENV"
      - name: Check out device source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Xcode and install build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi
      - name: Obtain and verify Apple build inputs
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1200 'https://updates.cdn-apple.com/2024FallFCS/fullrestores/062-78914/A081E8C4-D00A-4FC5-A650-A42EA1726236/iPad_10.2_17.7_21H16_Restore.ipsw' --output "$RUNNER_TEMP/restore.ipsw"
          python3 source-ci/prepare_ipsw_input.py --ipsw "$RUNNER_TEMP/restore.ipsw" --output "$UNIXNU_IPSW"
          rm "$RUNNER_TEMP/restore.ipsw"
      - name: Check out pinned UniXNU source
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/UniXNU/UniXNU.git "$RUNNER_TEMP/unixnu"
          git -C "$RUNNER_TEMP/unixnu" checkout 245aca1a9ec5b730b1cad80fade295800d2981f1
      - name: Preserve upstream patches for legacy bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source-ci/nabu-build.sh')
          text = p.read_text()
          old = 'for item in configs scripts patches platform ufs gpu usb userprobe vendor; do'
          new = 'for item in configs scripts platform ufs gpu usb userprobe vendor; do'
          assert text.count(old) == 1, 'Legacy staging list changed; review required'
          text = text.replace(old, new)
          marker = 'echo "== collect_outputs"'
          assert text.count(marker) == 1, "Collector boundary changed; review required"
          p.write_text(text.split(marker)[0])
          print('Legacy bootstrap uses prepared upstream XNU patches')
          PY
      - name: Build bootstrap kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nabu-logs"
          bash source-ci/nabu-build.sh --upstream "$RUNNER_TEMP/unixnu" --profile nabu_bootstrap_defconfig --work "$RUNNER_TEMP/nabu-build" 2>&1 | tee "$RUNNER_TEMP/nabu-logs/bootstrap.log"
      - name: Verify bootstrap candidate
        run: |
          python3 - <<'PY'
          import hashlib, json, os, struct, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          kernel = root / 'unixnu/out/nabu/kernel/kernel.macho'
          data = kernel.read_bytes()
          assert len(data) > 1048576, 'Kernel candidate is unexpectedly small'
          magic, cpu = struct.unpack_from('<II', data)
          assert magic == 0xfeedfacf and cpu == 0x100000c, 'Expected ARM64 Mach-O'
          report = {
              'device': 'nabu', 'os_inputs': 'iPadOS 17.7 (21H16)',
              'profile': 'nabu_bootstrap_defconfig',
              'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data),
              'upstream_commit': subprocess.check_output(['git', '-C', str(root / 'unixnu'), 'rev-parse', 'HEAD'], text=True).strip(),
              'hardware_tested': False, 'desktop_boot_tested': False,
              'scope': 'bootstrap kernel compile and prelink check',
              'collector': 'public workflow SHA-256 and Mach-O header check',
          }
          output = root / 'nabu-logs/bootstrap-manifest.json'
          output.write_text(json.dumps(report, indent=2) + '\n')
          print(output.read_text())
          PY
      - name: Print compiler diagnostics
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/unixnu/out/nabu/logs/"*.log; do
            if [ -f "$log" ]; then
              echo "$log"
              grep -n -C 5 -E ': (fatal )?error:|^error:' "$log" || true
              tail -n 15 "$log"
            fi
          done
      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabu-bootstrap-log
          path: |
            ${{ runner.temp }}/nabu-logs/*
            ${{ runner.temp }}/unixnu/out/nabu/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
