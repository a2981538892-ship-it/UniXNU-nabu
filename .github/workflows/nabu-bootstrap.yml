name: Nabu 17.7 bootstrap build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nabu-bootstrap-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Set build paths
        run: |
          echo "UNIXNU_IPSW=$RUNNER_TEMP/ipsw-21h16-small.zip" >> "$GITHUB_ENV"
          echo "UNIXNU_DEVICE=$RUNNER_TEMP/nabu-build/device" >> "$GITHUB_ENV"
      - name: Check out device source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Xcode and install build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi
      - name: Obtain and verify Apple build inputs
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://updates.cdn-apple.com/2024FallFCS/fullrestores/062-78914/A081E8C4-D00A-4FC5-A650-A42EA1726236/iPad_10.2_17.7_21H16_Restore.ipsw' --output "$RUNNER_TEMP/restore.ipsw"
          python3 source-ci/prepare_ipsw_input.py --ipsw "$RUNNER_TEMP/restore.ipsw" --output "$UNIXNU_IPSW"
          rm "$RUNNER_TEMP/restore.ipsw"
      - name: Check out pinned UniXNU source
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/UniXNU/UniXNU.git "$RUNNER_TEMP/unixnu"
          git -C "$RUNNER_TEMP/unixnu" checkout 245aca1a9ec5b730b1cad80fade295800d2981f1
      - name: Preserve upstream patches for legacy bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source-ci/nabu-build.sh')
          text = p.read_text()
          old = 'for item in configs scripts patches platform ufs gpu usb userprobe vendor; do'
          new = 'for item in configs scripts platform ufs gpu usb userprobe vendor; do'
          assert text.count(old) == 1, 'Legacy staging list changed; review required'
          p.write_text(text.replace(old, new))
          print('Legacy bootstrap uses the prepared upstream XNU patch directory')
          PY
      - name: Build bootstrap kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
